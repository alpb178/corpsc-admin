# Render Blueprint for the hub API (NestJS + Prisma + PostgreSQL).
# Import at: Render → New → Blueprint.
#
# Copied from tu-chamba/render.yaml, with one important difference:
# HUB_ENCRYPTION_KEY is NOT created with generateValue. If Render regenerated it
# on a redeploy, the credentials already stored would be unreadable forever.
# It's entered by hand once and never touched.

databases:
  - name: corpsc-hub-db
    databaseName: corpsc_hub
    plan: free

services:
  - type: web
    name: corpsc-hub-api
    runtime: node
    plan: free
    region: oregon
    rootDir: api
    # Render's free plan doesn't run preDeployCommand, so migrations and the
    # seed go in the build. Both are idempotent (`migrate deploy`, `upsert` by
    # slug/key in seed.ts): a project registered in the seed is live on the
    # next deploy without a manual `pnpm seed`. `seedAdmin` only acts when
    # SEED_ADMIN_EMAIL/SEED_ADMIN_PASSWORD are set, which they aren't here, so
    # it's a no-op on every other deploy.
    buildCommand: pnpm install && pnpm prisma generate && pnpm build && pnpm prisma migrate deploy && pnpm seed
    startCommand: node dist/main
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: corpsc-hub-db
          property: connectionString
      # Direct connection for `prisma migrate deploy` (prisma.config.ts). With
      # Supabase: the session pooler one (port 5432), never the 6543 one, which
      # is transaction mode and leaves the build hanging.
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Dashboard domain. Filled in by hand in the Render dashboard.
      - key: CORS_ORIGINS
        sync: false
      # Master key used to encrypt the projects' ingest keys. 32 bytes in
      # base64:
      #   openssl rand -base64 32
      # NEVER generateValue: a regeneration would make the already-encrypted
      # keys unreadable and they'd have to be registered again in all four repos.
      - key: HUB_ENCRYPTION_KEY
        sync: false
      # Swagger and localhost CORS stay closed unless this says development.
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.1.0
