# Local Postgres for development. In production Render provides the database
# (see api/render.yaml), so this compose file isn't deployed anywhere.
services:
  db:
    image: postgres:18-alpine
    container_name: corpsc-hub-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: corpsc_hub
    ports:
      - "5433:5432"   # 5433 so it doesn't clash with a local Postgres on 5432
    volumes:
      - hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d corpsc_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hub_pgdata:
